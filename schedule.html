<!DOCTYPE html>
<html>




<head>
    <title>Schedule Generator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        .centered {
            text-align: center;
            font-weight: bolder;
        }
    </style>
</head>






<body>





    <div class="container-fluid bg-secondary text-white centered">
        <img src="images/logo.png" width="120" alt="Student Hub Logo">
        <h1>Schedule Generator</h1>
    </div>




    <div class="some">
        <hr>

        <a class="link visited" href="index.html">Home</a> |
        <a class="link visited" href="gpa.html">GPA Calculator</a> |
        <a class="link visited" href="schedule.html">Schedule</a> |
        <a class="link visited" href="resources.html">Resources</a> |
        <a class="link visited" href="professors.html">Professors</a> |
        <a class="link visited" href="events.html">Events</a> |
        <a class="link visited" href="about.html">About Us</a> |
        <hr>

    </div>








    <div class="container bg-warning" style="padding: 20px; margin-top: 20px;">
        <h2>Enter Course Details</h2>






        <form action="https://httpbin.org/get" method="get">

            <p>
                Course Code:
                <input type="text" name="course_code">
            </p>



            <p>
                Section Number:
                <input type="text" name="section_number">
            </p>




            <p>
                Day:
                <select name="day">
                    <option>Sunday</option>
                    <option>Monday</option>
                    <option>Tuesday</option>
                    <option>Wednesday</option>
                    <option>Thursday</option>
                </select>
            </p>





            <p>
                Class Time:
                <input type="time" name="class_time">
            </p>




            
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">

        </form>

        <hr>
    </div>

</body>
<footer class="container-fluid bg-secondary text-white text-center py-3" style="font-weight: bolder;">
        <p>Student Hub 2026 - Sultan Qaboos University</p>
</footer>
</html>
