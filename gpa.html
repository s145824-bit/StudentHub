    <h2>Enter Course Information</h2>








    <form action="https://httpbin.org/get" method="get">



        <p>
            Course Code:
            <input type="text" name="course_code">
        </p>




        <p>
            Credit Hours:
            <input type="number" name="credit_hours">
        </p>





        <p>
            Grade:
            <select name="grade">
                <option>A</option>
                <option>A-</option>
                <option>B+</option>
                <option>B</option>
                <option>B-</option>
                <option>C+</option>
                <option>C</option>
                <option>C-</option>
                <option>D+</option>
                <option>D</option>
                <option>F</option>
            </select>
        </p>





        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
