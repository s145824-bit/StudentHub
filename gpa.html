            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>








<body>
    <div class="container-fluid bg-secondary">

        <img src="images/logo.png" width="120" alt="Student Hub Logo">

        <h1 class="text-white"
            style="font-size: 100px; text-align: center; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; font-weight: bolder;">
            GPA Calculator
        </h1>
        
    </div>





    <div class="some">
        <hr>

        <a class="link visited" href="index.html">Home</a> |
        <a class="link visited" href="gpa.html">GPA Calculator</a> |
        <a class="link visited" href="schedule.html">Schedule</a> |
        <a class="link visited" href="resources.html">Resources</a> |
        <a class="link visited" href="professors.html">Professors</a> |

        <a class="link visited" href="about.html">About Us</a> |

    <div class="container bg-warning" style="padding: 20px; margin-top: 20px;">
        <h2>GPA Calculator</h2>
        <p>Calculate your GPA by entering your course details below.</p>









    <form action="https://httpbin.org/get" method="get">



        <p>
            Course Code:
            <input type="text" name="course_code">
        </p>




        <p>
            Credit Hours:
            <input type="number" name="credit_hours">
        </p>





        <p>
            Grade:
            <select name="grade">
                <option>A</option>
                <option>A-</option>
                <option>B+</option>
                <option>B</option>
                <option>B-</option>
                <option>C+</option>
                <option>C</option>
                <option>C-</option>
                <option>D+</option>
                <option>D</option>
                <option>F</option>
            </select>
        </p>





        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>




    <hr>
    </div>




    

</body>
<footer class="container-fluid bg-secondary text-white text-center py-3" style="font-weight: bolder;">
