<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>Contact Us</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container-fluid bg-secondary">

        <img src="images/logo.png" width="120" alt="Student Hub Logo">

        <h1 class="text-white"
            style="font-size: 100px; text-align: center; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; font-weight: bolder;">
            Contact Us
        </h1>

        <p style="font-size: 30px; text-align: center;">
            Feel free to reach out to us with any questions or feedback!
        </p>

    </div>
    <div class="some">
        <hr>

        <a class="link visited" href="index.html">Home</a> |
        <a class="link visited" href="gpa.html">GPA Calculator</a> |
        <a class="link visited" href="schedule.html">Schedule</a> |
        <a class="link visited" href="resources.html">Resources</a> |
        <a class="link visited" href="professors.html">Professors</a> |
        <a class="link visited" href="events.html">Events</a> |
        <a class="link visited" href="about.html">About Us</a> |
        <a class="link visited" href="contact.html">Contact Us</a>

        <hr>
    </div>

    <div class="container bg-warning"
         style="padding: 20px; margin-top: 20px;">

        <form action="mailto:s141164@student.squ.edu.om"
              method="post"
              enctype="text/plain">

            <div class="mb-3">
                <label for="name" class="form-label"><span class="required"> Name:</span></label>
                <input type="text"
                       class="form-control"
                       id="name"
                       name="name"
                       required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label"><span class="required"> Email:</span></label>
                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       required>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label"><span class="required"> Message:</span></label>
                <textarea class="form-control"
                          id="message"
                          name="message"
                          rows="4"
                          required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Send
            </button>

        </form>

    </div>

    <hr>

    <p>Student Hub 2026 - Sultan Qaboos University</p>

</body>

</html>
