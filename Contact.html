<!DOCTYPE html>
<html xmlns=″http://www.w3.org/1999/xhtml″>
    <head> <title>Contact Us</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container-fluid bg-secondary">
            <a class="text-white" style="font-weight:bold ; font-style: normal;" href="index.html">back!</a>
            <h1 class="text-white" style="font-size: 100px; text-align: center; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; font-weight: bolder;">Contact Us</h1>
            <p style="font-size: 30px; text-align: center;">Feel free to reach out to us with any questions or feedback!</p>
        </div>

        <div class="container bg-warning" style="padding: 20px; margin-top: 20px;">
            <form id="contact-form">
                <div class="mb-3">
                    <label for="name" class="form-label">Name:</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Message:</label>
                    <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send</button>
            </form>
        </div>
        <script>
            document.getElementById("contact-form").addEventListener("submit", function (event) {
                event.preventDefault();

                const formData = new FormData(event.currentTarget);
                const subject = encodeURIComponent("Contact form message");
                const body = encodeURIComponent(
                    `Name: ${formData.get("name")}\nEmail: ${formData.get("email")}\n\n${formData.get("message")}`
                );

                window.location.href = `mailto:s141164@student.squ.edu.om?subject=${subject}&body=${body}`;
            });
        </script> 
    </body>
</html>
